<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elitic AI / PRO</title>
    <link rel="icon" href="https://avatars.githubusercontent.com/u/133261640?s=400&u=dc30d58ba9d6f34f1f662e4f5a9ebbbec55e1212&v=4">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: none !important;
            outline: none !important;
            display: block;
            background-color: #020617;
        }
    </style>
</head>
<body>
    <iframe
        id="elitic-iframe"
        src="https://eliteworldwideholding.pythonanywhere.com/elitic/api/pricing" 
        allow="payment"
        frameborder="0"
    ></iframe>

    <script>
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('token');

        const iframe = document.getElementById('elitic-iframe');

        if (token) {
            history.replaceState(null, "", window.location.pathname);
        }

        iframe.addEventListener('load', () => {
            if (token) {
                iframe.contentWindow.postMessage(
                    { type: 'SET_TOKEN', token: token },
                    'https://eliteworldwideholding.pythonanywhere.com'
                );
            }
        });
    </script>
</body>
</html>
