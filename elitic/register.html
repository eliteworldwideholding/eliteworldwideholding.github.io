<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elitic | Register Account</title>
    <link rel="icon" href="https://avatars.githubusercontent.com/u/133261640?s=400&u=dc30d58ba9d6f34f1f662e4f5a9ebbbec55e1212&v=4">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script src="/i18n.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500/30">

    <nav class="flex justify-between items-center py-6 px-6 md:px-12 max-w-6xl w-full mx-auto border-b border-slate-900">
        <div class="text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300 font-mono">>_ Elitic AI</div>
        
        <div class="flex items-center gap-6">
            <select aria-label="Language Selector" class="lang-selector bg-slate-900 text-slate-400 text-xs border border-slate-800 rounded px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500 font-mono">
                <option value="en">EN</option>
                <option value="pt">PT</option>
                <option value="es">ES</option>
                <option value="fr">FR</option>
                <option value="de">DE</option>
                <option value="it">IT</option>
                <option value="ru">RU</option>
                <option value="ja">JA</option>
                <option value="ko">KO</option>
                <option value="zh">ZH</option>
                <option value="ar">AR</option>
            </select>
            <a href="/elitic" data-i18n="register_go_back" class="text-xs md:text-sm font-mono text-slate-400 hover:text-blue-400 transition-colors duration-200">
                &larr; Go Back
            </a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center py-12 px-6">
        <div class="w-full max-w-md">
            
            <div class="text-center mb-8">
                <span data-i18n="register_early_access" class="inline-block bg-blue-950/60 border border-blue-900/50 text-blue-400 text-xs font-mono px-3 py-1 rounded-full mb-4 tracking-wide uppercase">
                    ⚡ Early Access
                </span>
                <h1 data-i18n="register_title" class="text-3xl font-bold tracking-tight text-white mb-2">Create your account</h1>
                <p data-i18n="register_subtitle" class="text-sm text-slate-400">Start turning your readings into active learning.</p>
            </div>

            <div class="bg-slate-900/40 border border-slate-900 p-8 rounded-2xl backdrop-blur-sm shadow-2xl shadow-blue-950/10 hover:border-slate-800 transition-all duration-300">
                
                <form id="registerForm" class="space-y-5">
                    <div>
                        <label for="fullName" data-i18n="register_fullname" class="block text-xs font-mono uppercase text-slate-400 mb-2">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required data-i18n="register_name_placeholder" placeholder="Your name"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-200">
                    </div>
                
                    <div>
                        <label for="email" data-i18n="register_email" class="block text-xs font-mono uppercase text-slate-400 mb-2">Email Address</label>
                        <input type="email" id="email" name="email" required data-i18n="register_email_placeholder" placeholder="your@email.com"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-200">
                    </div>
                
                    <div>
                        <label for="password" data-i18n="register_password" class="block text-xs font-mono uppercase text-slate-400 mb-2">Password</label>
                        <input type="password" id="password" name="password" required data-i18n="register_password_placeholder" placeholder="••••••••"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-200">
                    </div>
                
                    <div class="cf-turnstile"
                            data-sitekey="0x4AAAAAAD8ZxzZpmZblOdcv"
                            data-theme="dark">
                    </div>
                
                    <div class="flex items-center gap-3 pt-1">
                        <input type="checkbox" id="terms" name="terms" required
                            class="w-4 h-4 rounded border-slate-800 bg-slate-950 text-blue-600 focus:ring-blue-500/20 focus:ring-offset-slate-950">
                        <label for="terms" class="text-xs text-slate-400 leading-snug">
                            <span data-i18n="register_agree_text">I agree to the </span><a href="/terms" data-i18n="register_agree_tos" class="text-blue-400 hover:underline">Terms of Service</a><span data-i18n="register_agree_and"> and </span><a href="/privacy" data-i18n="register_agree_privacy" class="text-blue-400 hover:underline">Privacy Policy</a>.
                        </label>
                    </div>
                
                    <button type="submit"
                        class="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium text-sm py-3 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2 group">
                        <span data-i18n="register_submit">Create My Account</span>
                        <span class="group-hover:translate-x-1 transition-transform duration-200">&rarr;</span>
                    </button>
                </form>
                
                <script>
                document.getElementById('registerForm').addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const formData = new FormData(this);
                    
                    const payload = {
                        name: formData.get('fullName'),
                        email: formData.get('email'),
                        password: formData.get('password'),
                        turnstile_token: formData.get('cf-turnstile-response')
                    };
                
                    try {
                        const response = await fetch('https://eliteworldwideholding.pythonanywhere.com/elitic/api/register', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                
                        const result = await response.json();
                
                        if (response.ok && result.ok) {
                            window.location.href = '#success';
                        } else {
                            alert(result.message || 'Error processing registration.');
                            if (window.turnstile) {
                                turnstile.reset();
                            }
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Network error. Please try again.');
                    }
                });
                </script>
                <div class="mt-6 pt-6 border-t border-slate-900 text-center">
                    <p class="text-xs text-slate-500">
                        <span data-i18n="register_already_account">Already have an account? </span>
                        <a href="/elitic/login.html" data-i18n="register_login" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Log in</a>
                    </p>
                </div>

            </div>
        </div>
    </main>

    <footer class="py-8 px-6 text-center border-t border-slate-900 text-slate-600 text-xs font-mono max-w-6xl w-full mx-auto">
        <p data-i18n="footer_copy">&copy; 2026 Elite Worldwide Holding. Shipped cleanly, built independently.</p>
    </footer>

</body>
</html>
